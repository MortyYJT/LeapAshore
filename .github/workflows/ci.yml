name: Offline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    services:
      # The suite runs against a real PostgreSQL, not a stub: it asserts the cookie-level isolation,
      # the ON DELETE CASCADE, the first-contact savepoint race and the seeded catalogue mirror, and
      # none of those survive being mocked. `compose.yaml` runs the same image locally on 55432; here
      # the container publishes 5432 and `DATABASE_URL` below points the app at it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offerpilot
          POSTGRES_PASSWORD: offerpilot
          POSTGRES_DB: offerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `app/config.py` reads `database_url` from the environment and falls back to the local
      # composition; `api/.env` is not committed, so CI supplies the value here.
      DATABASE_URL: postgresql+psycopg://offerpilot:offerpilot@localhost:5432/offerpilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install the backend dependencies
        run: python -m pip install -e ".[test]"
      - name: Apply the database migrations
        run: python -m alembic upgrade head
      - name: Run the backend tests
        run: python -m pytest -q

# Not covered by this workflow, and deliberately so:
#
# - The end-to-end walkthrough (`make screenshots`) drives a real Chromium through
#   `scripts/e2e-walkthrough.cjs`. It currently borrows Playwright from a sibling
#   checkout, so it only runs locally. Adding it here means installing Playwright
#   in CI first.
# - Automated interface checks are handled by the Vibe-coding exception in
#   AGENTS.md: pages are accepted from real browser output, not from TDD.
# - The three guards `make test` runs first (`scripts/check-no-fake-dates.cjs`,
#   `scripts/verify-programs-mirror.cjs` and `scripts/verify-roadmap-mirror.cjs`) stay
#   out of this workflow. Each mirror guard compares its `web/lib/*.ts` against the
#   committed snapshot and needs no service, so they belong with the frontend if they
#   are wired in later; the backend's own half of that contract is
#   `api/tests/test_seed.py` and `api/tests/test_seed_roadmap.py`, which the backend job
#   above runs.
