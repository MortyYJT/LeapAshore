[project]
name = "offerpilot-api"
version = "0.2.0"
description = "FastAPI service for the OfferPilot recommendation agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.15,<2.0",
    "sentry-sdk[fastapi]>=2.40,<3.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncmy>=0.2.10,<1.0",
    "pymilvus>=2.6,<2.7",
    "mcp>=1.28,<2.0",
    "langchain-mcp-adapters>=0.1.13,<0.4",
    "langfuse>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pip-audit>=2.10,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
