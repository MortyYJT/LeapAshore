[project]
name = "leapashore-api"
version = "0.1.0"
description = "LeapAshore backend"
requires-python = ">=3.12"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  # FastAPI parses a multipart upload into an `UploadFile` only when this is installed; without it
  # the material-upload route raises at import time rather than on the first request.
  "python-multipart",
  # The advisor agent: a LangGraph state graph over an OpenAI-compatible chat model. Versions match
  # the ones the MEWHELP agent this design is ported from was run against.
  "langgraph==1.2.9",
  "langchain-core==1.4.9",
  "langchain-openai==1.3.5",
  # Advisor rate limits and token quotas (openspec/changes/advisor-limits); its asyncio client.
  "redis",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

# Without this, setuptools' flat-layout auto-discovery sees two top-level directories (`app` and
# `alembic`) and refuses to build: "Multiple top-level packages discovered in a flat-layout". `uv pip
# install -e` used to tolerate that, `pip install` does not, and CI installs with pip. The backend is
# the `app` package; `alembic/` is migrations and `tests/` is the suite, neither is part of the
# distribution.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
