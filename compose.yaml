services:
  # PostgreSQL 16 with pgvector (openspec hybrid-retrieval). `C` collation keeps text in code-point
  # order, which is what the earlier Alpine (musl) image gave; a new volume, because a data directory
  # written under musl has text indexes in an order glibc does not agree with (D1).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: offerpilot
      POSTGRES_DB: offerpilot
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=en_US.utf8"
    ports:
      - "55432:5432"
    volumes:
      - offerpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Advisor rate limits and token quotas (openspec/changes/archive/2026-10-30-advisor-limits); the Celery queue in P1
  # reuses it. Bound to loopback because it has no password.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - offerpilot-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The collection queue (openspec/changes/collect-queue). Behind the `queue` profile, so `make db-up`
  # does not start them; locally the queue usually runs from the venv instead (`make worker`), where
  # Chrome is available for pages that need rendering. Snapshots stay in api/var/snapshots (not in git).
  worker:
    profiles: ["queue"]
    build: ./api
    command: ["celery", "-A", "app.worker", "worker", "--pool", "threads", "--concurrency", "4", "--loglevel", "INFO"]
    env_file:
      - path: ./api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:offerpilot@db:5432/offerpilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      COLLECT_CAN_RENDER: "false"
    volumes:
      - ./api/var/snapshots:/app/var/snapshots
      - ./api/data/requirements:/app/data/requirements
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    profiles: ["queue"]
    build: ./api
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:offerpilot@db:5432/offerpilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  offerpilot-pgdata:
  offerpilot-redis:
