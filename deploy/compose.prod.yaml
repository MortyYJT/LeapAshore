# Production stack: Caddy in front, routing /api/* to FastAPI and everything else to Next.js, so the
# browser sees a single origin and the anonymous client cookie stays same-origin.
# Secrets come from deploy/.env on the server (never committed); see deploy/.env.example.
services:
  # PostgreSQL 16 with pgvector (openspec hybrid-retrieval D1). Moved here from postgres:16-alpine by
  # dump and restore into the new volume `pgdata`: a data directory written under Alpine's musl has
  # text indexes in an order glibc disagrees with. `C` collation keeps the code-point order musl gave.
  # The old volume `db-data` is kept, untouched, for rollback (note/handoff.md).
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: offerpilot
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=en_US.utf8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:${POSTGRES_PASSWORD}@db:5432/offerpilot
      # Arms the startup guard: login mode here refuses the log-only mail backend.
      APP_ENV: production
      # X-Forwarded-For is read only from the caddy container, which sets it to the address it
      # accepted the connection from (Caddyfile); any other peer is counted as itself.
      TRUSTED_PROXIES: caddy
      REDIS_URL: redis://redis:6379/0
      # A knowledge-gap review sends re-collection tasks to the queue (openspec knowledge-gaps D7).
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - documents:/app/var/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Advisor rate limits and daily token counters (openspec/changes/archive/2026-10-30-advisor-limits); the P1 Celery
  # queue reuses it. Not published: only containers on this network reach it, so no password.
  # noeviction makes a full Redis refuse writes (the advisor then answers 503) instead of silently
  # dropping counters or queued tasks.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The collection queue (openspec/changes/archive/2026-10-30-collect-queue). The worker fetches official pages (robots.txt,
  # one request per host every 2 s, refusals recorded) and extracts them with the advisor's model under
  # a daily spend cap; it never writes the catalogue (D8). Snapshots live in the `snapshots` volume; the
  # database stores only school keys and sha256s, never a path (D9). The image has no Chrome, so pages
  # that need rendering are deferred here and collected locally.
  worker:
    build: ../api
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "--pool", "threads", "--concurrency", "2", "--loglevel", "INFO"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:${POSTGRES_PASSWORD}@db:5432/offerpilot
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      COLLECT_CAN_RENDER: "false"
    volumes:
      - snapshots:/app/var/snapshots
      - documents:/app/var/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # Daily: re-collect pages not fetched for 30 days (04:07 Beijing), and the 90-day anonymous-data
  # sweep (03:17), which does nothing until AUTH_ENABLED is on. One beat only: two would send twice.
  beat:
    build: ../api
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/app/var/beat/celerybeat-schedule"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:${POSTGRES_PASSWORD}@db:5432/offerpilot
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - beat-data:/app/var/beat
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    environment:
      # The Next server's own reads (the return-visit redirect, the library pages) go straight to the
      # API container; the browser's go through Caddy.
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; losing them on rebuild risks Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
      # Static files for the personal website at mortyyjt.site (see Caddyfile).
      - /srv/mortyyjt.site:/srv/mortyyjt.site:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  # The postgres:16-alpine data directory before the pgvector move; kept for rollback, not mounted.
  db-data:
  redis-data:
  documents:
  snapshots:
  beat-data:
  caddy-data:
  caddy-config:
