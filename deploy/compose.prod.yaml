# Production stack: Caddy in front, routing /api/* to FastAPI and everything else to Next.js, so the
# browser sees a single origin and the anonymous client cookie stays same-origin.
# Secrets come from deploy/.env on the server (never committed); see deploy/.env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: offerpilot
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://offerpilot:${POSTGRES_PASSWORD}@db:5432/offerpilot
      # Arms the startup guard: login mode here refuses the log-only mail backend.
      APP_ENV: production
      # X-Forwarded-For is read only from the caddy container, which sets it to the address it
      # accepted the connection from (Caddyfile); any other peer is counted as itself.
      TRUSTED_PROXIES: caddy
      REDIS_URL: redis://redis:6379/0
    volumes:
      - documents:/app/var/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Advisor rate limits and daily token counters (openspec/changes/advisor-limits); the P1 Celery
  # queue reuses it. Not published: only containers on this network reach it, so no password.
  # noeviction makes a full Redis refuse writes (the advisor then answers 503) instead of silently
  # dropping counters or queued tasks.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ../web
    restart: unless-stopped
    environment:
      # The Next server's own reads (the return-visit redirect, the library pages) go straight to the
      # API container; the browser's go through Caddy.
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; losing them on rebuild risks Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
      # Static files for the personal website at mortyyjt.site (see Caddyfile).
      - /srv/mortyyjt.site:/srv/mortyyjt.site:ro
    depends_on:
      - web
      - api

volumes:
  db-data:
  redis-data:
  documents:
  caddy-data:
  caddy-config:
